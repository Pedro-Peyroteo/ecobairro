stages:
  - deploy

deploy_production:
  stage: deploy
  tags:
    - proxmox
  before_script:
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$DEPLOY_SSH_KEY_B64" | tr -d '\r\n ' | base64 -d > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - echo "StrictHostKeyChecking no" > ~/.ssh/config
  script:
    # 1. Criar o arquivo .env localmente no Runner
    - echo "POSTGRES_USER=$POSTGRES_USER" > .env
    - echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD" >> .env
    - echo "POSTGRES_DB=$POSTGRES_DB" >> .env
    - echo "JWT_ACCESS_SECRET=$JWT_ACCESS_SECRET" >> .env
    - echo "JWT_REFRESH_SECRET=$JWT_REFRESH_SECRET" >> .env
    - echo "APP_BASE_URL=$APP_BASE_URL" >> .env
    - echo "CLOUDFLARE_TUNNEL_TOKEN=$CLOUDFLARE_TUNNEL_TOKEN" >> .env
    - echo "NODE_ENV=production" >> .env

    # 2. Criar a pasta no CT2 (Prod) e sincronizar
    - ssh "$SERVER_USER@$SERVER_IP" "mkdir -p ~/apps/ecobairro"
    - rsync -av --delete --exclude='.git/' --exclude='node_modules/' ./ "$SERVER_USER@$SERVER_IP:~/apps/ecobairro/"

    # 3. Build e arranque no destino remoto
    - ssh "$SERVER_USER@$SERVER_IP" "cd ~/apps/ecobairro/infra/compose && docker compose -f docker-compose.prod.yml --env-file ../../.env up -d --build && docker image prune -f"
  only:
    - main
